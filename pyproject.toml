[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-biomechanics"
version = "0.0.1"
description = "A tool for generating 16 segment human models based on height and weight and generating scenes using those models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dušan Mišković", email = "md200149@student.etf.bg.ac.rs" },
    { name = "Kosta Nedeljković", email = "md200703@student.etf.bg.ac.rs" },
    { name = "Marko Tepavčević", email = "md200340@student.etf.bg.ac.rs" },
]
keywords = ["mujoco","biomechanics","simulation","human model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mujoco>=3.3.4",
    "numpy>=1.26",
    "pandas>=2.0",
]
[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "twine>=6",
]
[project.urls]
Homepage = "https://github.com/Beca-Filip/mujoco-biomechanics"
Repository = "https://github.com/Beca-Filip/mujoco-biomechanics"
[project.scripts]
mujoco-biomechanics-generate = "mujoco_biomechanics_code.generate_human_model:main"
mujoco-biomechanics-inspect = "mujoco_biomechanics_code.mjinspect:main"
mujoco-biomechanics-run-scene = "mujoco_biomechanics_code.run_model:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"mujoco_biomechanics_code.data" = ["*.csv"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"